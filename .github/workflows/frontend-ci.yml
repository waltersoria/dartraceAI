name: Frontend Angular CI

on:
  push:
    branches: [main, 'fix/vercel-angular-json-demo']
    paths: ['frontend/**', 'vercel.json', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', 'vercel.json', '.github/workflows/frontend-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate screens and JSON
        run: npm test
      - name: Production Angular build
        run: npm run build:production
      - name: Validate static Vercel artifacts
        run: |
          test -f dist/dartrace-frontend/browser/index.html
          for file in context sectors series inspections reports; do
            test -f "dist/dartrace-frontend/browser/assets/data/${file}.json"
          done
